<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Management System</h1>

        <form id="studentForm">

            <input
                type="text"
                id="name"
                placeholder="Student Name"
                required
            >

            <input
                type="number"
                id="age"
                placeholder="Age"
                required
            >

            <input
                type="text"
                id="campus"
                placeholder="Campus"
                required
            >

            <button type="submit">
                Add Student
            </button>

        </form>

        <h2>Students</h2>

        <div id="studentList"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
